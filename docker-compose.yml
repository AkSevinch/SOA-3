services:
  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight_db
    ports:
      - "5433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_db
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    networks:
      default:
        ipv4_address: 172.30.99.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no", "--replicaof", "172.30.99.10", "6379"]
    networks:
      default:
        ipv4_address: 172.30.99.11
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-sentinel:
    image: redis:7-alpine
    command: ["sh", "-c", "[ -f /data/sentinel.conf ] || cp /etc/redis/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel"]
    volumes:
      - ./deploy/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
      - sentinel-data:/data
    networks:
      default:
        ipv4_address: 172.30.99.12
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q ."]
      interval: 3s
      timeout: 3s
      retries: 20

  flight-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile.flight
    environment:
      FLIGHT_DB_DSN: postgres://flight:flight@flight-db:5432/flight_db?sslmode=disable
      GRPC_ADDR: ":50051"
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-dev-flight-key}
      REDIS_SENTINEL_ADDRS: redis-sentinel:26379
      REDIS_MASTER_NAME: mymaster
    ports:
      - "50051:50051"
    depends_on:
      flight-db:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile.booking
    environment:
      BOOKING_DB_DSN: postgres://booking:booking@booking-db:5432/booking_db?sslmode=disable
      HTTP_ADDR: ":8080"
      FLIGHT_GRPC_ADDR: flight-service:50051
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-dev-flight-key}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_OPEN_TIMEOUT: ${CIRCUIT_BREAKER_OPEN_TIMEOUT:-15s}
      CIRCUIT_BREAKER_WINDOW: ${CIRCUIT_BREAKER_WINDOW:-30s}
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started

volumes:
  flight-db-data:
  booking-db-data:
  sentinel-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.99.0/24
